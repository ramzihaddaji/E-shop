<div class="product-management-container">

  <!-- Formulaire ajout / modification produit -->
  <mat-card class="product-form-card">
    <h2>{{ editingProduct ? 'Modifier le produit' : 'Ajouter un produit' }}</h2>
    <form [formGroup]="productForm" (ngSubmit)="addOrUpdateProduct()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nom du produit</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Prix (€)</mat-label>
        <input matInput type="number" formControlName="price">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Quantité</mat-label>
        <input matInput type="number" formControlName="quantity">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Image URL</mat-label>
        <input matInput formControlName="image">
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">
        {{ editingProduct ? 'Mettre à jour' : 'Ajouter' }}
      </button>
      <button mat-button type="button" *ngIf="editingProduct" (click)="productForm.reset(); editingProduct=null">
        Annuler
      </button>
    </form>
  </mat-card>

  <!-- Table produits -->
  <mat-card class="product-table-card">
    <h2>Liste des produits</h2>
    <table mat-table [dataSource]="products" class="mat-elevation-z8">

      <!-- Image -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef> Image </th>
        <td mat-cell *matCellDef="let product">
          <img [src]="product.image" alt="{{product.name}}" class="product-image">
        </td>
      </ng-container>

      <!-- Nom -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nom </th>
        <td mat-cell *matCellDef="let product"> {{product.name}} </td>
      </ng-container>

      <!-- Prix -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Prix </th>
        <td mat-cell *matCellDef="let product"> €{{product.price}} </td>
      </ng-container>

      <!-- Quantité -->
      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef> Quantité </th>
        <td mat-cell *matCellDef="let product"> {{product.quantity}} </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let product">
          <button mat-button color="accent" (click)="editProduct(product)">Éditer</button>
          <button mat-button color="warn" (click)="deleteProduct(product)">Supprimer</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>

</div>
