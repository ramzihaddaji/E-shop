<div class="catalogue-container">

  <!-- Slider 3D -->
  <div class="slider-3d" (mouseenter)="pauseRotate()" (mouseleave)="startAutoRotate()">
    <div class="carousel" [style.transform]="getCarouselTransform()">
      <div
        class="slide"
        *ngFor="let product of featuredProducts; let i = index"
        [style.transform]="getSlideTransform(i)"
      >
        <img [src]="product.image" [alt]="product.name" />
        <div class="slider-info">
          <h3>{{ product.name }}</h3>
          <p>${{ product.price }}</p>
        </div>
      </div>
    </div>
    <!-- Manual Controls -->
    <button class="slider-control prev" (click)="rotate(-1)">&#10094;</button>
    <button class="slider-control next" (click)="rotate(1)">&#10095;</button>
  </div>

  <!-- Filtres Catégories -->
  <div class="categories">
    <button
      mat-raised-button
      *ngFor="let cat of categories"
      (click)="filterCategory(cat)"
      [color]="selectedCategory === cat ? 'primary' : 'accent'"
    >
      {{ cat }}
    </button>
  </div>

  <!-- Liste des produits -->
  <div class="product-list">
    <mat-card class="product-card" *ngFor="let product of filteredProducts">
      <img mat-card-image [src]="product.image" [alt]="product.name" />
      <mat-card-content>
        <h3>{{ product.name }}</h3>
        <p>${{ product.price }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" (click)="addToCart(product)">
          Ajouter au panier
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
